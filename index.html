<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconcile Check</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --border: #dde1e7;
    --on: #1f7a4a; --on-bg: #e3f4ea; --off: #b3261e; --off-bg: #fbe7e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .summary { display: flex; gap: 12px; margin: 16px 0 24px; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: .9rem; }
  .pill.on, .badge.on { background: var(--on-bg); color: var(--on); }
  .pill.off, .badge.off { background: var(--off-bg); color: var(--off); }
  .pill.total { background: var(--card); border: 1px solid var(--border); }
  label.load { font-size: .9rem; color: var(--muted); cursor: pointer; text-decoration: underline; }
  label.load input { display: none; }
  .school { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .school.off { border-left: 6px solid var(--off); }
  .school.on { border-left: 6px solid var(--on); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  .status, .notes { padding: 16px 20px; }
  .status { border-right: 1px solid var(--border); }
  h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .date, .label { color: var(--muted); font-size: .85rem; }
  .badge { display: inline-block; margin: 10px 0; padding: 3px 10px; border-radius: 6px; font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
  .metric-name { font-weight: 600; }
  .metric-val { font-size: 1.4rem; font-weight: 700; }
  .notes p { margin: 4px 0 0; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
    .status { border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Reconcile Check</h1>
    <label class="load">Load a different CSV<input type="file" id="file" accept=".csv,text/csv"></label>
  </header>
  <div class="summary" id="summary"></div>
  <div id="list"><div class="empty">Loading visits.csv…</div></div>
</main>
<script>
  // Minimal CSV parser: handles quoted fields containing commas, quotes ("") and newlines.
  function parseCSV(text) {
    const rows = []; let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [header, ...data] = rows.filter(r => r.some(v => v.trim()));
    const keys = header.map(h => h.trim().toLowerCase());
    return data.map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] || '').trim()])));
  }

  const isOff = s => /off/i.test(s.status);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render(schools) {
    // Off-track schools first so Stacy sees what needs attention.
    schools.sort((a, b) => isOff(b) - isOff(a) || a.school.localeCompare(b.school));
    const off = schools.filter(isOff).length;

    const summary = document.getElementById('summary');
    summary.replaceChildren(
      el('span', 'pill total', `${schools.length} schools`),
      el('span', 'pill off', `${off} off-track`),
      el('span', 'pill on', `${schools.length - off} on-track`)
    );

    const list = document.getElementById('list');
    if (!schools.length) { list.replaceChildren(el('div', 'empty', 'No schools in this file.')); return; }

    list.replaceChildren(...schools.map(s => {
      const cls = isOff(s) ? 'off' : 'on';
      const card = el('section', `school ${cls}`);
      const row = el('div', 'row');

      const status = el('div', 'status');
      status.append(
        el('h2', null, s.school),
        el('div', 'date', s.visit_date ? `Visited ${s.visit_date}` : ''),
        el('span', `badge ${cls}`, isOff(s) ? 'Off-track' : 'On-track'),
        el('div', 'metric-name', s.metric),
        el('div', 'metric-val', s.current),
        el('div', 'label', s.target ? `Target: ${s.target}` : '')
      );

      const notes = el('div', 'notes');
      notes.append(el('div', 'label', "Renée's visit notes"), el('p', null, s.notes || '—'));

      row.append(status, notes);
      card.append(row);
      return card;
    }));
  }

  function showError(msg) {
    document.getElementById('list').replaceChildren(el('div', 'empty', msg));
  }

  fetch('visits.csv')
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(t => render(parseCSV(t)))
    .catch(() => showError('Couldn’t load visits.csv automatically. Use “Load a different CSV” above to open it.'));

  document.getElementById('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(t => render(parseCSV(t))).catch(() => showError('Couldn’t read that file.'));
  });
</script>
</body>
</html>
